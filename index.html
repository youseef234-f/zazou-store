<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>زازو - Zazou Pet Shop</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #FF6B35;
      --primary-dark: #E85A24;
      --secondary: #2EC4B6;
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text: #2B2D42;
      --text-muted: #6C757D;
      --border: #E9ECEF;
      --shadow: 0 4px 15px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); direction: rtl; }

    /* Header */
    header {
      background: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }
    .logo { font-size: 24px; font-weight: 800; color: var(--primary); text-decoration: none; }
    .search-bar { flex: 1; max-width: 500px; position: relative; }
    .search-bar input {
      width: 100%;
      padding: 10px 15px 10px 40px;
      border: 1px solid var(--border);
      border-radius: 20px;
      outline: none;
    }
    .search-bar i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    .header-actions { display: flex; gap: 15px; align-items: center; }
    .action-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text); position: relative; }
    .badge {
      position: absolute; top: -5px; right: -8px; background: var(--primary);
      color: white; border-radius: 50%; width: 18px; height: 18px;
      font-size: 11px; display: flex; align-items: center; justify-content: center;
    }

    /* Hero Slider */
    .hero { position: relative; height: 250px; border-radius: var(--radius); margin: 20px; overflow: hidden; }
    .hero-slide {
      position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s ease;
      background-size: cover; background-position: center;
      display: flex; align-items: center; padding: 30px; color: white;
    }
    .hero-slide.active { opacity: 1; }
    .hero-content { background: rgba(0, 0, 0, 0.4); padding: 20px; border-radius: var(--radius); }

    /* Categories */
    .categories { display: flex; gap: 10px; padding: 0 20px; overflow-x: auto; margin-bottom: 20px; }
    .cat-chip {
      padding: 8px 16px; border-radius: 20px; background: var(--card-bg);
      border: 1px solid var(--border); cursor: pointer; white-space: nowrap; transition: 0.2s;
    }
    .cat-chip.active, .cat-chip:hover { background: var(--primary); color: white; border-color: var(--primary); }

    /* Product Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .product-card {
      background: var(--card-bg); border-radius: var(--radius);
      padding: 15px; box-shadow: var(--shadow); display: flex; flex-direction: column;
    }
    .product-img { width: 100%; height: 160px; object-fit: contain; border-radius: 8px; margin-bottom: 10px; }
    .product-title { font-weight: 600; font-size: 15px; margin-bottom: 8px; flex: 1; }
    .product-price { font-weight: 700; color: var(--primary); margin-bottom: 10px; }
    .add-btn {
      background: var(--secondary); color: white; border: none;
      padding: 8px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%;
    }

    /* Pagination Controls */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 30px 0; }
    .page-btn {
      padding: 8px 16px; border: 1px solid var(--border); background: var(--card-bg);
      border-radius: 6px; cursor: pointer;
    }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Cart Drawer */
    .cart-drawer {
      position: fixed; top: 0; left: -350px; width: 320px; height: 100%;
      background: var(--card-bg); box-shadow: var(--shadow); z-index: 200;
      transition: left 0.3s ease; padding: 20px; display: flex; flex-direction: column;
    }
    .cart-drawer.open { left: 0; }
    .cart-items { flex: 1; overflow-y: auto; margin: 15px 0; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

    /* Toast Notification */
    .toast {
      position: fixed; bottom: 20px; right: 20px; background: #333; color: #fff;
      padding: 12px 20px; border-radius: 8px; display: none; z-index: 300;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="logo">زازو 🐾</a>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="بحث عن منتج..." onkeyup="handleSearch()">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>
    <div class="header-actions">
      <button class="action-btn" onclick="toggleCart()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Slider -->
  <div class="hero">
    <div class="hero-slide active" style="background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1548767797-d8c844163c4c?w=1000');">
      <div class="hero-content">
        <h2>عروض زازو الحصرية 🔥</h2>
        <p>خصومات تصل إلى 30% على مستلزمات الكلاب والقطط</p>
      </div>
    </div>
  </div>

  <!-- Categories -->
  <div class="categories">
    <button class="cat-chip active" onclick="filterCategory('all', this)">الكل</button>
    <button class="cat-chip" onclick="filterCategory('cats', this)">قطط</button>
    <button class="cat-chip" onclick="filterCategory('dogs', this)">كلاب</button>
    <button class="cat-chip" onclick="filterCategory('food', this)">طعام</button>
  </div>

  <!-- Product Grid -->
  <main class="products-grid" id="productsGrid"></main>

  <!-- Pagination -->
  <div class="pagination">
    <button class="page-btn" id="prevBtn" onclick="changePage(-1)">السابق</button>
    <span id="pageIndicator">صفحة 1</span>
    <button class="page-btn" id="nextBtn" onclick="changePage(1)">التالي</button>
  </div>

  <!-- Cart Drawer -->
  <div class="cart-drawer" id="cartDrawer">
    <h3>سلة التسوق 🛒</h3>
    <div class="cart-items" id="cartItems"></div>
    <h4>الإجمالي: <span id="cartTotal">0</span> ج.م</h4>
    <button class="add-btn" style="margin-top: 15px;" onclick="checkout()">إتمام الشراء</button>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">تمت إضافة المنتج للسلة</div>

  <script>
    // محاكاة قاعدة بيانات ضخمة تحتوي على آلاف المنتجات
    const totalProductsCount = 3000;
    const itemsPerPage = 12;
    let currentPage = 1;
    let currentCategory = 'all';
    let searchQuery = '';
    let cart = [];

    // مولد بيانات وهمية محلياً لتفادي البطء
    function generateMockProducts(page, category, search) {
      let list = [];
      for (let i = 1; i <= totalProductsCount; i++) {
        let cat = i % 2 === 0 ? 'cats' : 'dogs';
        let title = `منتج رقم ${i} - ${cat === 'cats' ? 'مستلزمات قطط' : 'مستلزمات كلاب'}`;
        
        if (category !== 'all' && cat !== category) continue;
        if (search && !title.includes(search)) continue;

        list.push({
          id: i,
          title: title,
          price: (i % 50 + 1) * 10,
          category: cat,
          img: 'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=300'
        });
      }

      // إرجاع الجزء الخاص بالصفحة الحالية فقط (Pagination)
      const start = (page - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      return {
        items: list.slice(start, end),
        totalFilteredPages: Math.ceil(list.length / itemsPerPage)
      };
    }

    // عرض المنتجات الخاصة بالصفحة الحالية فقط
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      const data = generateMockProducts(currentPage, currentCategory, searchQuery);

      if (data.items.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">لا توجد نتائج matching.</p>';
        return;
      }

      data.items.forEach(product => {
        grid.innerHTML += `
          <div class="product-card">
            <img src="${product.img}" class="product-img" alt="${product.title}">
            <div class="product-title">${product.title}</div>
            <div class="product-price">${product.price} ج.م</div>
            <button class="add-btn" onclick="addToCart('${product.title}', ${product.price})">إضافة للسلة</button>
          </div>
        `;
      });

      // تحديث عناصر التحكم بالصفحات
      document.getElementById('pageIndicator').innerText = `صفحة ${currentPage} من ${data.totalFilteredPages || 1}`;
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage >= data.totalFilteredPages;
    }

    // إدارة التصفح والتنقل
    function changePage(direction) {
      currentPage += direction;
      renderProducts();
      window.scrollTo({ top: 300, behavior: 'smooth' });
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = cat;
      currentPage = 1;
      renderProducts();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim();
      currentPage = 1;
      renderProducts();
    }

    // إدارة السلة
    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('open');
    }

    function addToCart(title, price) {
      cart.push({ title, price });
      updateCartUI();
      showToast();
    }

    function updateCartUI() {
      document.getElementById('cartCount').innerText = cart.length;
      const cartItemsContainer = document.getElementById('cartItems');
      cartItemsContainer.innerHTML = '';
      let total = 0;

      cart.forEach((item) => {
        total += item.price;
        cartItemsContainer.innerHTML += `
          <div class="cart-item">
            <span>${item.title}</span>
            <strong>${item.price} ج.م</strong>
          </div>
        `;
      });

      document.getElementById('cartTotal').innerText = total;
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function checkout() {
      if (cart.length === 0) return alert('السلة فارغة!');
      alert('تم استلام طلبك بنجاح!');
      cart = [];
      updateCartUI();
      toggleCart();
    }

    // التشغيل عند تحميل الصفحة
    document.addEventListener('DOMContentLoaded', () => {
      renderProducts();
    });
  </script>
</body>
</html>
